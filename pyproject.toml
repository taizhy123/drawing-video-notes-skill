[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "art-video-notes"
version = "0.1.0"
description = "Offline-first preprocessing for Codex drawing-course notes"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "art-video-notes-skill contributors"}]
dependencies = [
  "PyYAML>=6.0",
  "opencv-python>=4.8",
  "Pillow>=10.0",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0"]
dev = ["pytest>=7.4"]

[project.scripts]
art-course-notes = "art_course_notes.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
